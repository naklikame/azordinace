# Nasazení na Netlify z větve main.
#
# Web běží v serverovém režimu Nextu, ne jako statický export —
# podstránky ordinací mají vlastní metadata. Formulář odesílá z prohlížeče
# na Web3Forms, klíč je v proměnné NEXT_PUBLIC_WEB3FORMS_KEY.
# O převod na funkce se stará runtime pro Next.js, který Netlify doplní sám.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 16 vyžaduje aspoň 20.9. Dvaadvacítka je LTS a Netlify ji má ověřenou.
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Bezpečnostní hlavičky. Web nenačítá nic zvenčí kromě mapy z OpenStreetMap;
# formulář posílá data na api.web3forms.com.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Obrázky se nemění, ať je prohlížeč nestahuje opakovaně.
[[headers]]
  for = "/fotky/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
